<div id="nav">
    {% for a in nav_actions if a.align != "right" %}
        <a href="{{ url_for(a.endpoint) }}" class="navbutton">{{ a.name }}</a>
    {% endfor %}
    <div id="nav-right">
        {% for a in nav_actions if a.align == "right" %}
            <a href="{{ url_for(a.endpoint) }}" class="navbutton navbutton-icon" title="{{ a.name }}">{{ a.name }}</a>
        {% endfor %}
    </div>
</div>

<style>
#nav {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px;
    border-bottom: 1px solid #ccc;
    background: #007bff;
}

#nav-right {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
}

.navbutton {
    display: inline-block;
    padding: 6px 12px;
    background: #28a745;
    color: white;
    text-decoration: none;
    border-radius: 4px;
    font-weight: bold;
    cursor: pointer;
}

.navbutton:hover {
    background: #218838;
}

.navbutton-icon {
    padding: 6px 10px;
    background: transparent;
    border: 2px solid white;
    font-size: 16px;
    line-height: 1;
}

.navbutton-icon:hover {
    background: rgba(255, 255, 255, 0.2);
}
</style>
